[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truenex-memory"
version = "0.6.0"
description = "Local-first memory layer for coding agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Truenex" },
]
keywords = ["memory", "agents", "local-first", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.15",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "coverage>=7",
    "build>=1",
    "click>=8",
]
qdrant = [
    "qdrant-client>=1.12",
]
gui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
semantic = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
# Code-structure graph. Pinned below 0.10 deliberately: upstream ships a
# release every day or two while still pre-1.0, so the version moves when
# we decide it does. tests/unit/test_code_graph.py pins the extraction
# contract we depend on, so a breaking change surfaces in our own suite
# rather than in a changelog we did not read.
graph = [
    "graphifyy>=0.9.48,<0.10",
]

[project.urls]
Homepage = "https://memory.truenex.ai"
Documentation = "https://github.com/marcomnit/truenex-memory#readme"
Repository = "https://github.com/marcomnit/truenex-memory"
Issues = "https://github.com/marcomnit/truenex-memory/issues"
Changelog = "https://github.com/marcomnit/truenex-memory/blob/main/CHANGELOG.md"

[project.scripts]
truenex-mem = "truenex_memory.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/truenex_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows",
    "/docs",
    "/examples",
    "/scripts",
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    "/docs/codex-review-desktop-spec.md",
    "/docs/marketing",
    "/docs/session-refactor-manifest-2026-06-10.md",
    "/docs/v0_1_search_first_roadmap.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider", "-m", "not e2e and not qdrant"]
markers = [
    "e2e: slower end-to-end tests that may create virtual environments or subprocess sessions",
    "qdrant: integration tests requiring qdrant-client and a reachable local Qdrant service",
]
norecursedirs = [".task3_work", ".task_work", ".pytest-tmp", "pytest_tmp", "task_work_*"]
